# Build, test and package the Chrome extension.
# Every push/PR: an artifact "tabsage-extension" (download, unzip, chrome://extensions → Load unpacked).
# main: a rolling "latest" pre-release with the zip.
# Tags v*: a GitHub Release with tabsage-<version>.zip attached; the tag sets the version.
#   v0.2.4       → version 0.2.4, uploaded to the Chrome Web Store and submitted for review.
#   v0.2.4-test  → version 0.2.4, a GitHub pre-release, uploaded to the Store as a draft only.
name: Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm cache: this job publishes releases and builds the Store package, so a poisoned
          # cache from another run must not reach it.
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF_NAME#v}
            export RELEASE_VERSION=${v%%-*}   # v0.2.4-test → 0.2.4
          fi
          npm run build

      - name: E2E (Chromium loads the extension and organizes tabs)
        run: |
          npm install --no-save --ignore-scripts playwright@1
          npx playwright install --with-deps chromium
          node test/e2e/run.mjs | tee e2e.log
          grep -q "OK same-domain tabs share a group" e2e.log
          grep -q "no console errors" e2e.log

      - name: Package
        id: pkg
        run: |
          VERSION=$(node -p "require('./dist/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          (cd dist && zip -qr "../tabsage-$VERSION.zip" . -x '*.map')
          ls -la tabsage-*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabsage-extension-${{ steps.pkg.outputs.version }}
          path: |
            dist
            !dist/**/*.map

      - name: Publish rolling "latest" pre-release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "tabsage-${{ steps.pkg.outputs.version }}.zip" --prerelease \
            --target "$GITHUB_SHA" --title "Latest build (${{ steps.pkg.outputs.version }})" \
            --notes "Built from ${GITHUB_SHA}. Unzip, then chrome://extensions → Developer mode → Load unpacked."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: tabsage-${{ steps.pkg.outputs.version }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Chrome Web Store: on v* tags, upload the zip (Chrome Web Store API v2); plain tags also submit it
  # for review, tags with a suffix (v0.2.4-test) leave it as a draft. Skipped unless all five secrets
  # are set. The item must already exist (first upload by hand in the Developer Dashboard), and
  # submitting needs its Store listing and Privacy tabs filled in.
  webstore:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: chrome-web-store
    env:
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          for v in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN PUBLISHER_ID EXTENSION_ID; do
            if [ -z "${!v}" ]; then echo "::warning::CWS_$v not set; skipping Chrome Web Store publish"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.skip != '1'
        with:
          pattern: tabsage-extension-*
          path: ext
          merge-multiple: true

      - name: Upload${{ !contains(github.ref_name, '-') && ' and submit for review' || ' as a draft' }}
        if: steps.check.outputs.skip != '1'
        env:
          SUBMIT: ${{ !contains(github.ref_name, '-') }}
        run: |
          (cd ext && zip -qr ../extension.zip .)
          TOKEN=$(curl -fsS https://oauth2.googleapis.com/token \
            --data-urlencode client_id="$CLIENT_ID" --data-urlencode client_secret="$CLIENT_SECRET" \
            --data-urlencode refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          API=https://chromewebstore.googleapis.com
          ITEM="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          echo "Uploading…"
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary @extension.zip "$API/upload/v2/$ITEM:upload" | tee upload.json
          echo
          if jq -e '(.uploadState // "") | test("FAIL")' upload.json >/dev/null; then
            echo "::error::The Chrome Web Store rejected the package (see the response above)"; exit 1
          fi
          if [ "$SUBMIT" != "true" ]; then
            echo "Uploaded to the Chrome Web Store as a draft (not submitted: tag has a suffix)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Submitting for review…"   # retried: the uploaded package may still be processing
          for i in 1 2 3 4 5; do
            if curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                 -d '{}' "$API/v2/$ITEM:publish" | tee publish.json; then break; fi
            [ "$i" = 5 ] && exit 1
            sleep 30
          done
          echo "Submitted to the Chrome Web Store for review." >> "$GITHUB_STEP_SUMMARY"
