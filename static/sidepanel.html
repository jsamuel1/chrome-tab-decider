<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TabSage — Recent</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="sidepanel">
    <h3 id="recentHead">Recent</h3>
    <div id="recentList" role="listbox" aria-labelledby="recentHead"></div>
    <h3 id="usedHead" hidden>Most used</h3>
    <div id="usedList" role="listbox" aria-labelledby="usedHead"></div>
    <p class="muted small hint">Click a tab, or use ↑ ↓ and Enter. Alt+Shift+R opens this panel.</p>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
