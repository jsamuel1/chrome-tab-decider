<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TabSage</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header>
      <input id="q" type="search" placeholder="Search open & archived tabs…" autocomplete="off" autofocus />
    </header>

    <section id="results" hidden>
      <div id="openList"></div>
      <h3 id="archHead" hidden>Archived</h3>
      <div id="archList"></div>
    </section>

    <nav class="tabbar" id="tabbar" role="tablist">
      <button role="tab" id="tabRecent" aria-controls="recentPane" aria-selected="true">Recent</button>
      <button role="tab" id="tabGroups" aria-controls="groupsPane" aria-selected="false">Groups</button>
      <button id="settings" class="gear" title="Settings" aria-label="Settings">⚙</button>
    </nav>

    <div id="engine" class="engine" hidden></div>

    <section id="recentPane" role="tabpanel" aria-labelledby="tabRecent">
      <div id="recentList"></div>
      <h3 id="usedHead" hidden>Most used</h3>
      <div id="usedList"></div>
    </section>

    <section id="groupsPane" role="tabpanel" aria-labelledby="tabGroups" hidden>
      <div class="toolbar">
        <button id="organize" class="primary" title="Group & sort now (Alt+Shift+O)">Organize</button>
        <button id="rediscover" title="Re-read all titles and propose fresh folders">Re-discover</button>
      </div>
      <a href="#" id="newFolders" class="small" hidden></a>
      <p class="muted small hint">★ pins a group to the front and protects it from trimming</p>
      <div id="groups"></div>
      <div class="foot muted small" id="foot"></div>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
